# Configuration for OnePlus Smart FastCharge & Thermal Governor

# Enable or disable the charge governor daemon (1=enabled, 0=disabled)
governor_enabled=1

# Maximum battery temperature (Celsius) allowed for full speed fast charging (cool_down=0).
# If the temperature reaches or exceeds this threshold, the governor automatically releases
# control and allows the OEM thermal throttling to engage.
max_allowed_temp=42.0

# Hysteresis recovery temperature (Celsius).
# After a thermal throttle event, the governor will resume full speed charging only when the
# battery cools down to or below this threshold.
recovery_temp=38.0

# Allow full speed fast charging while the screen is on (1=enabled, 0=disabled).
screen_on_full_speed=1

# Polling and enforcement interval in milliseconds when charging is active (default: 500ms).
active_interval_ms=500

# Polling interval in milliseconds when discharging or idle (default: 3000ms).
idle_interval_ms=3000
